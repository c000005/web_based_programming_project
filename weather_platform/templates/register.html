<!-- web_based_programming_project/weather_platform/templates/register.html -->

{% include "_header.html" %}

{% include "_nav.html" %}

<div class="card" style="max-width: 500px; margin: 0 auto;">
    <div class="card-header" style="background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);">
        <h2>ثبت‌نام در سامانه تحلیلی هواشناسی</h2>
    </div>

    <form action="/weather_platform/register" method="POST">
        <div class="form-group">
            <label for="username">نام کاربری <span class="required">*</span></label>
            <input type="text" id="username" name="username" class="form-control" required>
        </div>

        <div class="form-group">
            <label for="email">ایمیل <span class="required">*</span></label>
            <input type="email" id="email" name="email" class="form-control" required>
        </div>

        <div class="form-group">
            <label for="password">رمز عبور <span class="required">*</span></label>
            <input type="password" id="password" name="password" class="form-control" required>
        </div>

        <div class="form-group">
            <label for="role">نقش کاربری</label>
            <select id="role" name="role" class="form-control">
                <option value="viewer">👀 Viewer</option>
                <option value="analyst">📊 Analyst</option>
                <option value="admin">👑 Admin</option>
            </select>
        </div>

        <div style="display: flex; gap: 10px;">
            <button type="submit" class="btn btn-success" style="flex: 1;">ثبت‌نام</button>
            <a href="/weather_platform/dashboard" class="btn btn-secondary" style="flex: 1; text-align: center;">انصراف</a>
        </div>
    </form>
</div>
{% include "_footer.html" %}
